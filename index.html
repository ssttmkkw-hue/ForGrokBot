<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <title>打砖块</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hud" aria-label="游戏状态">
      <div class="stat">
        <span class="label">分数</span>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <span class="label">关卡</span>
        <strong id="level">1</strong>
        <button type="button" id="pause" class="ghost" aria-hidden="true">暂停</button>
      </div>
      <div class="stat lives-stat">
        <span class="label">生命</span>
        <strong id="lives" aria-label="生命 3"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></strong>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="game" width="480" height="640" aria-label="打砖块游戏画面">
        你的浏览器不支持 Canvas，无法进行游戏。
      </canvas>
      <div id="overlay" class="overlay visible" role="dialog" aria-modal="true" aria-labelledby="title">
        <div class="panel">
          <p class="eyebrow" id="eyebrow">休闲小游戏</p>
          <h1 id="title">打砖块</h1>
          <p id="message">点击或按空格开始</p>
          <p id="extra">鼠标、触摸或方向键移动挡板 · 共 5 关</p>
          <button type="button" id="restart" hidden>再来一局</button>
        </div>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
